name: home-iot

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: home-iot-mqtt
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - mosquitto-password:/mosquitto/secrets
      - mosquitto-data:/mosquitto/data
  server:
    build:
      context: ./server
    container_name: home-iot-server
    restart: unless-stopped
    environment:
      DB_PATH: /data/home-iot.db
    volumes:
      - app-data:/data

    depends_on:
      - mqtt

    env_file:
      - ./server/.env

    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mosquitto-password:
  mosquitto-data:
  app-data: